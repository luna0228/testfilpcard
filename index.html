<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我們的服務</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ===== 顏色設定：改這裡就能換整站配色 ===== */
  :root {
    --bg: #F3F5F8;          /* 頁面背景 */
    --text: #fff;        /* 主要文字 */
    --muted: #fff;       /* 次要文字 */
    --card: #005C8A;        /* 卡片正面 */
    --card-border: #fff; /* 卡片邊框 */
    --accent: #fff;      /* 主色（脈動外框、圖示） */
    --back-bg: #FFDE4C;     /* 卡片背面底色 */
    --back-text: #000;   /* 卡片背面文字 */
    --pulse-speed: 2.4s;    /* 脈動速度，數字越大越慢 */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171F;
      --text: #E8ECF2;
      --muted: #9AA4B2;
      --card: #1B222D;
      --card-border: #2C3542;
      --accent: #3CC2B3;
      --back-bg: #155E57;
      --back-text: #F2FBFA;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.7;
  }

  /* ===== 頁首 ===== */
  header {
    max-width: 1080px;
    margin: 0 auto;
    padding: 4.5rem 1.5rem 2.5rem;
  }
  header h1 {
    margin: 0 0 .5rem;
    font-size: clamp(1.9rem, 4vw, 2.6rem);
    font-weight: 700;
    letter-spacing: .02em;
  }
  header p {
    margin: 0;
    max-width: 36em;
    color: var(--muted);
    font-size: 1.05rem;
  }

  /* ===== 卡片排列 ===== */
  .grid {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 1.5rem 5rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1.5rem;
    perspective: 1000px;
  }

  /* ===== 翻卡結構 ===== */
  .card {
    height: 260px;
    cursor: pointer;
    outline: none;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .65s cubic-bezier(.4, .2, .2, 1);
  }
  /* 滑鼠移入、鍵盤聚焦、手機點擊時翻面 */
  .card:hover .card-inner,
  .card:focus-visible .card-inner,
  .card.flipped .card-inner {
    transform: rotateY(180deg);
  }
  .card:focus-visible .front {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .front, .back {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 1.75rem;
  }
  .front {
    background: var(--card);
    border: 1px solid var(--card-border);
    align-items: flex-start;
  }
  .front .icon {
    width: 48px;
    height: 48px;
    margin-bottom: 1.25rem;
    color: var(--accent);
  }
  .front h2 {
    margin: 0 0 .35rem;
    font-size: 1.3rem;
    font-weight: 700;
  }
  .front p {
    margin: 0;
    color: var(--muted);
    font-size: .95rem;
  }
  .back {
    background: var(--back-bg);
    color: var(--back-text);
    transform: rotateY(180deg);
    font-size: 1rem;
  }
  .back h3 {
    margin: 0 0 .6rem;
    font-size: 1.1rem;
    font-weight: 700;
  }
  .back p { margin: 0; }

  /* ===== 待機動畫：脈動外框 =====
     想讓某張卡不要脈動，把那張卡的 class="card pulse" 改成 class="card" 即可 */
  .pulse .front::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 2px solid var(--accent);
    border-radius: 10px;
    pointer-events: none;
    animation: pulse-ring var(--pulse-speed) ease-out infinite;
    animation-delay: var(--delay, 0s);
  }
  @keyframes pulse-ring {
    0%   { opacity: .9; transform: scale(.9); }
    70%  { opacity: 0;  transform: scale(1.02); }
    100% { opacity: 0;  transform: scale(1.02); }
  }
  /* 翻面時停止脈動 */
  .card:hover .front::before,
  .card.flipped .front::before { animation-play-state: paused; opacity: 0; }

  /* 使用者在系統開啟「減少動態效果」時關閉動畫 */
  @media (prefers-reduced-motion: reduce) {
    .pulse .front::before { animation: none; opacity: 0; }
    .card-inner { transition: none; }
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: .85rem;
    padding: 0 1.5rem 2.5rem;
  }
</style>
</head>
<body>

<header>
  <h1>我們的服務</h1>
  <p>把滑鼠移到卡片上看詳細內容，手機上點一下就能翻面。</p>
</header>

<main class="grid">
  <!-- ===== 一張卡片 = 一個 <div class="card pulse"> 區塊，複製貼上即可新增 =====
       style="--delay: 0.4s" 是脈動延遲，讓每張卡輪流閃，不會同時亮 -->

  <div class="card pulse" tabindex="0" style="--delay: 0s">
    <div class="card-inner">
      <div class="front">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>
        <h2>品牌設計</h2>
        <p>從標誌到整體視覺</p>
      </div>
      <div class="back">
        <h3>品牌設計</h3>
        <p>協助你建立標誌、配色與字體規範，讓品牌在每個接觸點都保持一致。</p>
      </div>
    </div>
  </div>

 
</main>

<footer>© 2026 你的品牌名稱</footer>

<script>
  // 手機（沒有滑鼠）時，點一下卡片翻面，再點一下翻回來
  document.querySelectorAll('.card').forEach(function (card) {
    card.addEventListener('click', function () {
      if (window.matchMedia('(hover: none)').matches) {
        card.classList.toggle('flipped');
      }
    });
    // 鍵盤按 Enter 或空白鍵也能翻面
    card.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        card.classList.toggle('flipped');
      }
    });
  });
</script>
</body>
</html>
